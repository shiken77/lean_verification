services:
  - type: web
    name: lean-verification
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: APP_REQUIRE_AUTH
        value: "0"
      - key: BENCHMARK_WORKERS
        value: "1"
